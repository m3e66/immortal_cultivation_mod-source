<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.22" stop-color="#dffcff" stop-opacity="1"/>
      <stop offset="0.50" stop-color="#81e8ef" stop-opacity="0.92"/>
      <stop offset="0.76" stop-color="#8e64ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4b1b8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperTail" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0" stop-color="#e9ffff" stop-opacity="0.96"/>
      <stop offset="0.22" stop-color="#8df5ef" stop-opacity="0.75"/>
      <stop offset="0.58" stop-color="#6d74e8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5a2d98" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lowerTail" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="0.24" stop-color="#b98cff" stop-opacity="0.73"/>
      <stop offset="0.62" stop-color="#6342c8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#29134f" stop-opacity="0"/>
    </linearGradient>
    <filter id="wideGlow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Original twin-tailed jade-violet comet, drawn specifically for this mod. -->
  <path d="M36 177 C116 160 191 132 273 109 C333 92 373 91 421 113 C349 108 300 120 241 145 C165 177 102 196 36 204 Z"
        fill="url(#lowerTail)" opacity="0.38" filter="url(#wideGlow)"/>
  <path d="M24 61 C113 74 192 95 276 112 C335 124 378 126 423 117 C360 145 300 144 238 126 C159 103 87 86 24 81 Z"
        fill="url(#upperTail)" opacity="0.44" filter="url(#wideGlow)"/>

  <path d="M22 69 C115 78 195 101 282 116 C338 126 381 127 423 117 C364 137 306 136 243 120 C158 98 88 82 22 75 Z"
        fill="url(#upperTail)" opacity="0.83" filter="url(#softGlow)"/>
  <path d="M32 192 C112 174 190 144 272 120 C329 103 374 101 422 116 C358 114 303 129 245 154 C166 188 99 205 32 210 Z"
        fill="url(#lowerTail)" opacity="0.70" filter="url(#softGlow)"/>

  <path d="M31 73 C128 84 207 105 292 118 C346 126 386 126 424 117 C369 131 315 128 254 116 C166 98 93 81 31 77 Z"
        fill="url(#upperTail)" opacity="0.96"/>
  <path d="M45 197 C125 178 197 151 278 128 C332 112 375 105 424 117 C366 119 314 138 255 163 C177 195 111 210 45 214 Z"
        fill="url(#lowerTail)" opacity="0.86"/>
  <path d="M75 131 C159 123 236 120 312 120 C356 120 390 119 426 116"
        fill="none" stroke="#efffff" stroke-width="4" stroke-linecap="round" opacity="0.78" filter="url(#softGlow)"/>
  <path d="M75 131 C159 123 236 120 312 120 C356 120 390 119 426 116"
        fill="none" stroke="#f5ffff" stroke-width="1.4" stroke-linecap="round" opacity="0.96"/>

  <ellipse cx="425" cy="117" rx="47" ry="43" fill="url(#core)" filter="url(#wideGlow)" opacity="0.64"/>
  <ellipse cx="425" cy="117" rx="31" ry="28" fill="url(#core)" filter="url(#softGlow)"/>
  <ellipse cx="429" cy="114" rx="14" ry="13" fill="#f4ffff" opacity="0.98"/>
  <circle cx="435" cy="109" r="5" fill="#ffffff"/>

  <g fill="#c9ffff">
    <circle cx="350" cy="91" r="1.8" opacity="0.75"/>
    <circle cx="319" cy="150" r="1.4" opacity="0.58"/>
    <circle cx="277" cy="92" r="1.2" opacity="0.49"/>
    <circle cx="231" cy="169" r="1.5" opacity="0.44"/>
    <circle cx="183" cy="103" r="1.0" opacity="0.40"/>
    <circle cx="142" cy="181" r="1.3" opacity="0.34"/>
  </g>
</svg>
